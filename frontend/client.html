<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Control</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.0.0/dist/socket.io.min.js"></script>
</head>
<body>
  <button onclick="sendCommand({ front: true })">Forward</button>
  <button onclick="sendCommand({ back: true })">Backward</button>
  <button onclick="sendCommand({ left: true })">Left</button>
  <button onclick="sendCommand({ right: true })">Right</button>
  <button onclick="sendCommand({ front: false, back: false, left: false, right: false })">Stop</button>

  <h2>Video Stream</h2>
  <video id="video" autoplay></video>

  <script>
    const socket = io('http://192.168.1.161:3000');
    const video = document.getElementById('video');

    socket.on('connect', () => {
      console.log('Connected to server');
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from server');
    });

    socket.on('connect_error', (err) => {
      console.error('Connection error:', err);
    });

    socket.on('connect_timeout', (timeout) => {
      console.error('Connection timeout:', timeout);
    });

    socket.on('video', (data) => {
      const blob = new Blob([data], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      video.src = url;
    });

    function sendCommand(directions) {
      const queryParams = new URLSearchParams(directions).toString();
      fetch(`http://192.168.1.161:3000/move?${queryParams}`)
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(error => console.error('Error:', error));
    }
  </script>
</body>
</html>
